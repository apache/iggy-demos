name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kafka-clients
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: kafka-clients/pom.xml
      - name: Format
        run: mvn -B spotless:check
      # Compiles the library, tests and demos without running the tests.
      - name: Compile
        run: mvn -B -Pdemo test-compile

  rust-demo:
    name: Rust demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kafka-clients/rust-demo
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kafka-clients/rust-demo
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Build
        run: cargo build --release

  license-headers:
    name: License headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: apache/skywalking-eyes/header@v0.9.0
