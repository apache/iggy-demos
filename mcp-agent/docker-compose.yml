# A single Iggy server for the MCP demo. The MCP server runs separately,
# started by the agent over stdio, and joins the network below.

services:
  iggy:
    image: apache/iggy:${IGGY_VERSION:-0.9.0}
    container_name: iggy-mcp-demo
    cap_add:
      - SYS_NICE
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      - IGGY_ROOT_USERNAME=iggy
      - IGGY_ROOT_PASSWORD=iggy
      - IGGY_NODE_ADVERTISED_ADDRESS=iggy
      # The default binds 127.0.0.1, which the MCP container cannot reach.
      - IGGY_TCP_ADDRESS=0.0.0.0:8090
      # The default numa:auto binds shard memory to NUMA nodes, which fails
      # under Docker Desktop.
      - IGGY_SHARDING_CPU_ALLOCATION=2
    networks:
      - iggy-mcp-demo
    ports:
      - ${IGGY_TCP_PORT:-8090}:8090

networks:
  iggy-mcp-demo:
    name: iggy-mcp-demo
