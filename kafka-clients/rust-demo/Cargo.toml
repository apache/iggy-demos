[package]
name = "iggy-sdk-demo"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "The Iggy SDK demo, written against the Iggy Rust SDK"

[dependencies]
axum = "0.8"
bytes = "1"
form_urlencoded = "1"
futures = "0.3"
iggy = "=0.11.0"
iggy_binary_protocol = "=0.11.0"
iggy_common = "=0.11.0"
rand = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
