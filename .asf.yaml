# All configurations could be found here: https://github.com/apache/infrastructure-asfyaml/

github:
  description: "Apache Iggy demos: demo applications and use cases built on Apache Iggy"
  homepage: https://iggy.apache.org
  features:
    issues: true
    discussions: false
  labels:
    - rust
    - java
    - kafka
    - message-streaming
    - iggy
    - apache
  enabled_merge_buttons:
    squash: true
    squash_commit_message: PR_TITLE_AND_DESC
    merge: false
    rebase: false

  pull_requests:
    del_branch_on_merge: true

  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true
      required_conversation_resolution: true
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        require_last_push_approval: true
        required_approving_review_count: 1
      required_status_checks:
        - name: "Java build"
          app_slug: "github-actions"
        - name: "Rust demo"
          app_slug: "github-actions"
        - name: "License headers"
          app_slug: "github-actions"
      required_status_checks_strict: true

notifications:
  commits: commits@iggy.apache.org
  issues: commits@iggy.apache.org
  pullrequests: commits@iggy.apache.org
