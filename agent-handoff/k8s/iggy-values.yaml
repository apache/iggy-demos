# Helm values for the Iggy broker, for the chart in helm/charts/iggy at the
# server-0.9.0 tag. Only the broker is deployed; the MCP servers are in mcp.yaml.

server:
  # The release is named iggy, so this is the Service the MCP servers dial.
  advertisedAddress: iggy
  image:
    tag: "0.9.0"
    pullPolicy: IfNotPresent
  users:
    root:
      username: iggy
      password: iggy
  env:
    - name: RUST_LOG
      value: info
    - name: IGGY_HTTP_ADDRESS
      value: "0.0.0.0:3000"
    - name: IGGY_TCP_ADDRESS
      value: "0.0.0.0:8090"
    - name: IGGY_QUIC_ADDRESS
      value: "0.0.0.0:8080"
    - name: IGGY_WEBSOCKET_ADDRESS
      value: "0.0.0.0:8092"
    # The default numa:auto binds shard memory to NUMA nodes, which fails on
    # kind under Docker Desktop.
    - name: IGGY_SHARDING_CPU_ALLOCATION
      value: "2"

ui:
  enabled: false
